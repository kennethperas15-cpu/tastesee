name: Deploy Taste & See to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify public Supabase configuration
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const configPath = path.join(process.env.GITHUB_WORKSPACE, "frontend/js/supabase-config.js");
          const config = fs.readFileSync(configPath, "utf8");
          const urlMatch = config.match(/window\.TASTESEE_SUPABASE_URL\s*=\s*("(?:[^"\\]|\\.)*")\s*;/);
          const keyMatch = config.match(/window\.TASTESEE_SUPABASE_ANON_KEY\s*=\s*("(?:[^"\\]|\\.)*")\s*;/);
          if (!urlMatch || !keyMatch) {
            throw new Error("Supabase URL and publishable key must be configured in frontend/js/supabase-config.js.");
          }
          const url = JSON.parse(urlMatch[1]);
          const key = JSON.parse(keyMatch[1]);
          let parsedUrl;
          try {
            parsedUrl = new URL(url);
          } catch {
            throw new Error("SUPABASE_URL must be a valid HTTPS URL.");
          }
          if (parsedUrl.protocol !== "https:") {
            throw new Error("SUPABASE_URL must use HTTPS.");
          }
          if (key.startsWith("sb_secret_") || key.startsWith("service_role")) {
            throw new Error("A Supabase secret/service-role key must never be deployed to the browser.");
          }
          const isPublishable = key.startsWith("sb_publishable_");
          let isLegacyAnon = false;
          if (!isPublishable && key.split(".").length === 3) {
            try {
              isLegacyAnon = JSON.parse(Buffer.from(key.split(".")[1], "base64url").toString("utf8")).role === "anon";
            } catch {
              isLegacyAnon = false;
            }
          }
          if (!isPublishable && !isLegacyAnon) {
            throw new Error("The browser config must contain a Supabase publishable key or a legacy anon key.");
          }
          console.log(`Verified public Supabase configuration for ${parsedUrl.origin}.`);
          NODE

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
